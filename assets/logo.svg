<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="djGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <radialGradient id="vinylGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a3042"/>
      <stop offset="70%" stop-color="#12151e"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
  </defs>
  <!-- Outer vinyl ring -->
  <circle cx="50" cy="50" r="46" fill="url(#vinylGlow)" stroke="url(#djGrad)" stroke-width="2.5"/>
  <!-- Grooves -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#252b3b" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#252b3b" stroke-width="1"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="#252b3b" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Center label -->
  <circle cx="50" cy="50" r="15" fill="url(#djGrad)"/>
  <circle cx="50" cy="4.5" r="4.5" fill="#08090d"/>
  <!-- Soundwave equalizer bars -->
  <rect x="22" y="44" width="2.5" height="12" rx="1.2" fill="#00e5ff" opacity="0.9"/>
  <rect x="27" y="38" width="2.5" height="24" rx="1.2" fill="#00e5ff" opacity="0.9"/>
  <rect x="70" y="38" width="2.5" height="24" rx="1.2" fill="#ff5722" opacity="0.9"/>
  <rect x="75" y="44" width="2.5" height="12" rx="1.2" fill="#ff5722" opacity="0.9"/>
</svg>
